name: PantheraLAB 3.0 Logo Assets
on:
  push:
    branches: [pantheralab-3.0]
    paths: ['.github/workflows/pantheralab-3-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-assets:
    runs-on: ubuntu-latest
    env:
      LOGO_THUMB_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fa5101396-dda5-4561-a744-759d6733fe04/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAAAAxvsOoSKpiOlAAJPHvvMSGI9W6E2aiSkgriSNP9BPY&exp=1791855707&osig=AAAAAAAAAAAAAAAAAAAAAHGla8ZvdFiA5mtJfcKYPDGfwRu4rVWzrwYWlx0cDoI3&signer=media-rpc&token=AAIAAU0AJGE1MTAxMzk2LWRkYTUtNDU2MS1hNzQ0LTc1OWQ2NzMzZmUwNAAAAAABoTLsQ3iT90mlw62FYxQimme5qMWcBOo1AvrN_bnQEq2ztFai3g&x-canva-quality=thumbnail'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pantheralab-3.0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install pillow
      - name: Fetch the supplied design and export independent PWA assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request, io
          from PIL import Image, ImageOps, ImageFilter
          url = __import__('os').environ['LOGO_THUMB_URL']
          hi = url.replace('/height:200/', '/height:1536/').replace('/width:133?', '/width:1024?').replace('x-canva-quality=thumbnail','x-canva-quality=full')
          image = None
          for candidate in (hi, url):
              try:
                  req=urllib.request.Request(candidate,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=24) as response:
                      data=response.read()
                  logo=Image.open(io.BytesIO(data)).convert('RGB')
                  if logo.width<100 or logo.height<150: raise ValueError('Unexpectedly small logo')
                  image=logo
                  print('Retrieved PantheraLAB image at',logo.size)
                  break
              except Exception as exc: print('Candidate unavailable:',type(exc).__name__,str(exc)[:160])
          if image is None: raise SystemExit('Could not fetch original PantheraLAB design')
          base=Path('v2/frontend/public')
          (base/'branding').mkdir(parents=True,exist_ok=True)
          (base/'icons').mkdir(parents=True,exist_ok=True)
          # Preserve the exact user-supplied poster composition, with image resizing only.
          image.save(base/'branding/pantheralab-3-original.webp','WEBP',quality=92,method=6)
          image.save(base/'branding/pantheralab-3-original.png','PNG',optimize=True)
          # Square icon from original graphic's jaguar face, preserving eye/nature-tech split.
          face=image.crop((int(image.width*.085),int(image.height*.175),
                            int(image.width*.915),int(image.height*.730)))
          face=ImageOps.fit(face,(512,512),Image.Resampling.LANCZOS,centering=(.5,.5))
          for size in (180,192,512):
              icon=face.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(base/f'icons/pantheralab-3-{size}.png',optimize=True)
          canvas=Image.new('RGB',(512,512),'#070d1a')
          masked=face.resize((396,396),Image.Resampling.LANCZOS)
          canvas.paste(masked,((512-396)//2,(512-396)//2))
          canvas.save(base/'icons/pantheralab-3-maskable-512.png',optimize=True)
          print('Generated independently branded mobile assets')
          PY
      - name: Commit artwork to isolated branch
        run: |
          git config user.name "pantheralab-brand-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/frontend/public/branding
          git add -f v2/frontend/public/icons/pantheralab-3-*.png
          git commit -m "Include exact PantheraLAB 3.0 logo poster and installable mobile icons"
          git push origin HEAD:pantheralab-3.0
