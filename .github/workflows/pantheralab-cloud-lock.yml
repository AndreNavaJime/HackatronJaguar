name: Lock cloud library frontend dependencies

on:
  push:
    branches: [feature/pantheralab-tenant-library-20261017]
    paths:
      - '.github/workflows/pantheralab-cloud-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pantheralab-tenant-library-20261017
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update frontend package-lock
        working-directory: v2/frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current'
          else
            git commit -m 'build: lock Supabase browser SDK dependencies'
            git push origin HEAD:feature/pantheralab-tenant-library-20261017
          fi
