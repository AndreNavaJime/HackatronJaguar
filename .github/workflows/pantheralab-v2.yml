name: PantheraLAB v2 checks

on:
  push:
    branches: [pantheraid-v2]
    paths:
      - "v2/**"
      - ".github/workflows/pantheralab-v2.yml"
  pull_request:
    branches: [pantheraid-v2]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and bundle
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Run API and video tests without AI weights
        run: pytest -q test_api.py test_video_api.py test_scientific_api.py
