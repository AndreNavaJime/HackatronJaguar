name: Resolve PantheraLIVE model dependencies

on:
  push:
    branches: [feature/pantheralive-local-animal-clips-20261017]
    paths:
      - '.github/workflows/pantheralive-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pantheralive-local-animal-clips-20261017
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update model dependencies lockfile
        working-directory: v2/frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock browser animal detector dependencies'
            git push origin HEAD:feature/pantheralive-local-animal-clips-20261017
          fi
