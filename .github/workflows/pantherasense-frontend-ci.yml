name: PantheraLAB experimental frontend check

on:
  push:
    branches: [pantherasense-integration]
    paths:
      - 'v2/frontend/**'
      - '.github/workflows/pantherasense-frontend-ci.yml'
  pull_request:
    branches: [pantherasense-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
