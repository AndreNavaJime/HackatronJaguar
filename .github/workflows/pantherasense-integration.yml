name: PantheraSENSE integration checks
on:
  push:
    branches: [pantherasense-integration]
  pull_request:
    branches: [pantheraid-v2]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - run: pytest -q test_api.py test_video_api.py test_scientific_api.py test_study_reports.py test_sense_api.py test_satellite_vegetation.py
