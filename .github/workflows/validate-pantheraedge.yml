name: Validate PantheraEDGE Python
on:
  pull_request:
    paths:
      - "app.py"
      - ".github/workflows/validate-pantheraedge.yml"
  push:
    branches:
      - "feature/pantheraedge-cientifico-v2-20261010"
jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify main app compiles
        run: python -m py_compile app.py
