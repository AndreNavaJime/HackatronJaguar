name: Vegetation live smoke (experimental)
on:
  push:
    branches: [pantherasense-integration]
permissions:
  contents: read
jobs:
  real-earth-search:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call experimental Render with nonsensitive San José coordinates
        shell: bash
        run: |
          set -euo pipefail
          echo 'Testing open Sentinel-2 endpoint with public approximate urban coordinates.'
          curl --silent --show-error --location --max-time 155 \
            -H 'Content-Type: application/json' \
            -d '{"latitude":9.93,"longitude":-84.08,"radius_km":0.2,"days_back":180,"max_cloud_cover":80}' \
            'https://pantherasense-backend-test.onrender.com/api/science/vegetation/analyze' \
            -w '\nHTTP_STATUS:%{http_code}\n' | tee /tmp/vegetation-response.txt
          python - <<'PY'
          import json
          from pathlib import Path
          text=Path('/tmp/vegetation-response.txt').read_text()
          body, status=text.rsplit('\nHTTP_STATUS:',1)
          code=int(status.strip())
          print('HTTP status:',code)
          if code!=200:
              raise SystemExit('Live vegetation endpoint did not compute successfully')
          result=json.loads(body)
          assert result['analysis_type']=='real_pixel_sample_experimental'
          assert -1<=result['latest']['ndvi_mean']<=1
          assert -1<=result['latest']['ndmi_mean']<=1
          assert result['latest']['sampled_valid_pixels']>=75
          print('Verified real scene id:',result['latest']['scene_id'])
          PY
